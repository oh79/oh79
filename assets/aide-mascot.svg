<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 11 11" shape-rendering="crispEdges">
  <!--
    aide 마스코트 logo 포즈 — apps/web/components/Mascot.tsx 의 LOGO_ROWS · LOGO_EYES ·
    LOGO_ANTENNA_X · LOGO_EYE_ROW 와 같은 좌표다. 한쪽을 고치면 다른 쪽도 고친다.
    아래 y="4" 두 줄(눈)이 LOGO_EYE_ROW=4 에 대응한다 — 정적 파일이라 상수를 직접 못 쓴다.

    배경은 깔지 않는다(투명). 대신 몸통이 어두운 색이라 다크 탭 바에서 묻히므로
    prefers-color-scheme 로 색을 뒤집는다. SVG favicon 은 이 미디어 쿼리를 지원한다.

    이 파일은 독립 문서라 CSS 변수를 쓸 수 없어 토큰의 실제 값을 하드코딩한다.
    MASCOT.md 4절 「색 하드코딩 금지」의 예외이며 그 문서에 근거를 남겼다.
      라이트  #1A1919 = ink/strong · #726A5A = ink/muted · #FAFAF9 = bg/base
      다크    #E6EDF3 = ink/inverse · #8B949E = terminal/dim · #0D1117 = bg/terminal

    토큰 이름을 CSS 표기(하이픈 두 개로 시작하는 형태)로 적지 않는다 —
    XML 주석은 하이픈 두 개를 담을 수 없어 파일 전체가 파싱 에러로 죽는다.
    서버는 200 을 주므로 빌드·CI 로는 잡히지 않고 아이콘만 조용히 사라진다.
  -->
  <style>
    .body { fill: #1A1919 }
    .antenna { fill: #726A5A }
    .eye { fill: #FAFAF9 }
    @media (prefers-color-scheme: dark) {
      .body { fill: #E6EDF3 }
      .antenna { fill: #8B949E }
      .eye { fill: #0D1117 }
    }
  </style>
  <g transform="translate(1, 1)">
    <rect class="antenna" x="4" y="0" width="1" height="1" />
    <rect class="body" x="3" y="1" width="4" height="1" />
    <rect class="body" x="2" y="2" width="6" height="1" />
    <rect class="body" x="1" y="3" width="8" height="1" />
    <rect class="body" x="0" y="4" width="9" height="1" />
    <rect class="body" x="0" y="5" width="9" height="1" />
    <rect class="body" x="0" y="6" width="9" height="1" />
    <rect class="body" x="1" y="7" width="2" height="1" />
    <rect class="body" x="6" y="7" width="2" height="1" />
    <rect class="eye" x="3" y="4" width="2" height="1" />
    <rect class="eye" x="6" y="4" width="2" height="1" />
  </g>
</svg>
